<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame Art Animations</title>
  <style>
    html, body { margin: 0; height: 100%; display: flex; flex-direction: column; background: #1b1917; color: #ddd; font: 13px/1.3 -apple-system, system-ui, sans-serif; overflow: hidden; }
    #bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 8px 12px; background: #111; border-bottom: 1px solid #333; }
    #bar label { display: inline-flex; align-items: center; gap: 6px; }
    #bar button, #bar select, #bar input[type=number] { background: #2a2623; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font: inherit; }
    #bar button { cursor: pointer; }
    #bar button:hover:not(:disabled) { background: #3a3430; }
    #bar button:disabled { opacity: .5; cursor: default; }
    #bar input[type=number] { width: 56px; }
    #controls { display: contents; }
    #status { margin-left: auto; color: #f0b070; min-width: 160px; text-align: right; }
    body.fs #bar { display: none; }
    body.fs #stage { cursor: none; }
    #stage { flex: 1; min-height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="prev">&larr;</button>
    <strong id="sceneName"></strong>
    <button id="next">&rarr;</button>
    <button id="pause">Pause</button>
    <button id="restart">Restart</button>
    <span id="controls"></span>
    <label>Res
      <select id="res"><option value="1920x1080">1080p</option><option value="3840x2160">4K</option></select>
    </label>
    <label>FPS
      <select id="fps"><option>30</option><option>60</option></select>
    </label>
    <label>Seconds <input id="secs" type="number" min="2" max="600" value="30"></label>
    <button id="exportMp4">Export MP4</button>
    <button id="exportPng">Save PNG</button>
    <button id="fullscreen">Fullscreen</button>
    <span id="status"></span>
  </div>
  <div id="stage"></div>

  <script src="libraries/p5.js"></script>
  <script src="libraries/OpenSimplexNoise.js"></script>
  <script src="libraries/mp4-muxer.js"></script>

  <script>var SCENES = [];</script>
  <!-- Scenes: add new ones here -->
  <script src="scenes/flocking-marching-squares/TerrainField.js"></script>
  <script src="scenes/flocking-marching-squares/Boid.js"></script>
  <script src="scenes/flocking-marching-squares/scene.js"></script>

  <script src="exporter.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
